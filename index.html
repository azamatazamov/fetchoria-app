<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ff6a00">
<title>Fetchoria</title>
<meta name="description" content="Save videos, music and pictures from any link.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --orange: #ff6a00;
    --orange-soft: #ffb347;
    --bg: #fff7ed;
    --card: #ffffff;
    --text: #1d1a17;
    --muted: #7a7068;
    --line: rgba(0, 0, 0, 0.07);
    --field: #fff3e6;
    --shadow: 0 10px 30px rgba(255, 106, 0, 0.16);
    --tabbar: 64px;
  }
  :root[data-theme="dark"] {
    --bg: #14151b;
    --card: #1f2129;
    --text: #f5f2ef;
    --muted: #a59d96;
    --line: rgba(255, 255, 255, 0.08);
    --field: #2a2c36;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom));
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  main { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--orange-soft); outline-offset: 2px; border-radius: 12px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; color: var(--orange); letter-spacing: -0.4px; }
  .brand svg { width: 34px; height: 34px; border-radius: 10px; box-shadow: var(--shadow); }
  .langs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .langs button[aria-pressed="true"] { background: var(--orange); color: #fff; }

  /* sections */
  section[hidden] { display: none; }
  section { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section { animation: none; } }

  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 4px 10px; font-weight: 700; }

  /* hero */
  .hero {
    background: linear-gradient(135deg, var(--orange-soft), var(--orange));
    border-radius: 26px; padding: 22px 18px 18px; color: #fff; box-shadow: var(--shadow); margin-top: 8px;
  }
  .hero h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.15; letter-spacing: -0.5px; }
  .hero p { margin: 0 0 16px; opacity: .92; font-size: 15px; }
  .field { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 16px; padding: 6px 6px 6px 14px; }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: #1d1a17; padding: 10px 0;
  }
  .field input::placeholder { color: #a99e95; }
  .mini { padding: 9px 12px; border-radius: 12px; background: #fff0e0; color: var(--orange); font-weight: 700; font-size: 14px; }
  .go {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 17px;
    background: #1d1a17; color: #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
  }
  .go:active, .mini:active, .row:active, .tool:active, .tab:active { transform: scale(.98); }

  /* song search */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
  .card .field { background: var(--field); }
  .card .field input { color: var(--text); }
  .card .field input::placeholder { color: var(--muted); }
  .card .mini { background: var(--orange); color: #fff; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; }

  /* tips */
  .tip { margin: 14px 2px 0; padding: 12px 14px; border-radius: 16px; background: var(--field); color: var(--muted); font-size: 14px; }
  .tip b { color: var(--text); }

  /* steps */
  ol { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 8px; }
  li.step { counter-increment: s; display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  li.step::before {
    content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--orange-soft), var(--orange)); color: #fff; font-weight: 800; font-size: 13px;
  }

  /* tools */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tool { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
  .tool .ic { font-size: 28px; line-height: 1; margin-bottom: 4px; }
  .tool b { font-size: 15px; }
  .tool span { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .tool.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
  .tool.wide .ic { margin: 0; }

  /* rows (account) */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .ic { width: 34px; height: 34px; display: grid; place-items: center; font-size: 19px; background: var(--field); border-radius: 11px; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .tx b { display: block; font-size: 16px; font-weight: 600; }
  .row .tx small { color: var(--muted); font-size: 13px; }
  .row .chev { color: var(--muted); font-size: 20px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin: 26px 0 0; }
  footer a { color: var(--muted); }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar) + 24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: #1d1a17; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); text-align: center; z-index: 30;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* tab bar */
  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .tabs { display: flex; width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 5px; box-shadow: var(--shadow); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 17px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { background: linear-gradient(135deg, var(--orange-soft), var(--orange)); color: #fff; }

  .page-head h2 { margin: 0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 10px 0; }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; background: var(--field); font-weight: 600; border: 2px solid transparent; }
  .chip[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; }
  .switch small { display: block; color: var(--muted); }
  .knob { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--field); position: relative; transition: background .2s; }
  .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .2s; }
  .switch[aria-checked="true"] .knob { background: var(--orange); }
  .switch[aria-checked="true"] .knob::after { transform: translateX(20px); }
  .hist { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hist:last-child { border-bottom: 0; }
  .hist .pic { flex: none; width: 64px; height: 64px; border-radius: 14px; background: var(--field) center / cover no-repeat; display: grid; place-items: center; font-size: 26px; }
  .hist .tx { flex: 1; min-width: 0; }
  .hist b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.3; }
  .hist small { display: block; margin-top: 3px; color: var(--muted); }
  .hist .copy { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--field); font-size: 18px; }
  .mini { padding: 9px 12px; border-radius: 12px; background: #fff0e0; color: var(--orange); font-weight: 700; font-size: 14px; }
  .go {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 17px;
    background: #1d1a17; color: #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
  }
  .go:active, .mini:active, .row:active, .tool:active, .tab:active { transform: scale(.98); }

  .card .field { background: var(--field); }

  footer a { color: var(--muted); }

  }

<body>
<main>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 640 640" role="img" aria-label="Fetchoria">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
        <rect width="640" height="640" fill="url(#g)"/>
        <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M190 170 H450 L320 395 Z" stroke-width="46"/><path d="M185 500 H455" stroke-width="46" fill="none"/>
        </g>
      </svg>
      fetchoria
    </div>
  </header>

  <!-- DOWNLOAD -->
  <section id="tab-download">
    <div class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
      <div class="field">
        <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="linkPh" aria-label="Link">
        <button class="mini" id="paste" data-i18n="paste"></button>
      </div>
      <button class="go" id="download" data-i18n="download"></button>
    </div>
    <div class="tip" id="tip" hidden></div>

    <h2 data-i18n="songTitle"></h2>
    <div class="card">
      <div class="field">
        <input id="song" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="songPh" aria-label="Song">
        <button class="mini" id="search" data-i18n="search"></button>
      </div>
    </div>

    <h2 data-i18n="sitesTitle"></h2>
    <div class="chips">
      <span class="chip">YouTube</span><span class="chip">Instagram</span><span class="chip">TikTok</span>
      <span class="chip">Facebook</span><span class="chip">Pinterest</span><span class="chip">X</span>
      <span class="chip">Reddit</span><span class="chip">Twitch</span><span class="chip">VK</span>
      <span class="chip">SoundCloud</span><span class="chip" data-i18n="more"></span>
    </div>

    <h2 data-i18n="stepsTitle"></h2>
    <ol>
      <li class="step" data-i18n="step1"></li>
      <li class="step" data-i18n="step2"></li>
      <li class="step" data-i18n="step3"></li>
    </ol>
  </section>

  <!-- TOOLS -->
  <section id="tab-tools" hidden>
    <h2 data-i18n="toolsTitle"></h2>
    <div class="grid">
      <button class="tool" data-cmd="pdf"><div class="ic">📄</div><b data-i18n="tPdf"></b><span data-i18n="tPdfText"></span></button>
      <button class="tool" data-chat="1"><div class="ic">🎞</div><b data-i18n="tVideo"></b><span data-i18n="tVideoText"></span></button>
      <button class="tool" data-chat="1"><div class="ic">🎙</div><b data-i18n="tVoice"></b><span data-i18n="tVoiceText"></span></button>
      <button class="tool" data-focus="song"><div class="ic">🔎</div><b data-i18n="tSong"></b><span data-i18n="tSongText"></span></button>
      <button class="tool wide" data-focus="link"><div class="ic">🎧</div><div><b data-i18n="tMusicLinks"></b><br><span data-i18n="tMusicLinksText"></span></div></button>
      <button class="tool wide" data-focus="link"><div class="ic">💬</div><div><b data-i18n="tSubs"></b><br><span data-i18n="tSubsText"></span></div></button>
      <button class="tool wide" data-focus="link"><div class="ic">🖼</div><div><b data-i18n="tPics"></b><br><span data-i18n="tPicsText"></span></div></button>
    </div>
  </section>

  <!-- ME -->
  <section id="tab-me" hidden>
    <h2 data-i18n="meTitle"></h2>
    <div class="list">
      <button class="row" data-cmd="settings" data-page="settings"><span class="ic">⚙️</span><span class="tx"><b data-i18n="rSettings"></b><small data-i18n="rSettingsText"></small></span><span class="chev">›</span></button>
      <button class="row" data-cmd="history" data-page="history"><span class="ic">🕘</span><span class="tx"><b data-i18n="rHistory"></b><small data-i18n="rHistoryText"></small></span><span class="chev">›</span></button>
      <button class="row" data-cmd="invite" data-page="invite"><span class="ic">🎁</span><span class="tx"><b data-i18n="rInvite"></b><small data-i18n="rInviteText"></small></span><span class="chev">›</span></button>
      <button class="row" data-cmd="language" data-page="language"><span class="ic">🌍</span><span class="tx"><b data-i18n="rLanguage"></b><small data-i18n="rLanguageText"></small></span><span class="chev">›</span></button>
    </div>
    <h2 data-i18n="moreTitle"></h2>
    <div class="list">
      <button class="row" data-cmd="share"><span class="ic">🔗</span><span class="tx"><b data-i18n="rShare"></b></span><span class="chev">›</span></button>
      <button class="row" data-cmd="donate"><span class="ic">❤️</span><span class="tx"><b data-i18n="rDonate"></b><small data-i18n="rDonateText"></small></span><span class="chev">›</span></button>

      languageTitle: "Язык", historyEmpty: "Загрузок пока нет. Последние появятся здесь.", clearHistory: "Очистить историю",
      cleared: "История очищена", copyLink: "Копировать ссылку", invitedCount: "Приглашено друзей", inviteText: "Каждый друг, пришедший по вашей ссылке, даёт вам {n} дополнительных загрузок в день.",
      inviteShare: "Отправить другу", inviteCopy: "Копировать мою ссылку", yourLink: "Ваша личная ссылка", saved: "Сохранено", loadFail: "Не удалось загрузить. Проверьте соединение.",
      unlimited: "без лимита",
    },

  const $ = (selector) => document.querySelector(selector);
  const $$ = (selector) => document.querySelectorAll(selector);
  const tg = window.Telegram && window.Telegram.WebApp;
  let lang = "en";

  /* ---------- language ---------- */
  function pickLanguage() {
    let saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) { /* storage may be blocked */ }
    const fromTelegram = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
    const code = (saved || fromTelegram || navigator.language || "en").slice(0, 2).toLowerCase();
    return TEXTS[code] ? code : "en";
  }

  function applyLanguage(code) {
    lang = code;
    document.documentElement.lang = code;
    $$("[data-i18n]").forEach((el) => { el.textContent = TEXTS[code][el.dataset.i18n]; });
    $$("[data-i18n-ph]").forEach((el) => { el.placeholder = TEXTS[code][el.dataset.i18nPh]; });
    $$(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
    $("#tip").innerHTML = TEXTS[code].tipKeyboard;
    try { localStorage.setItem("lang", code); } catch (e) { /* ignore */ }
  }

  const say = (key) => TEXTS[lang][key];

  /* ---------- small helpers ---------- */
  function haptic(kind) {
    try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) { /* not in Telegram */ }
  }

  let toastTimer;
  function toast(text) {
    const el = $("#toast");
    el.textContent = text;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    area.remove();
    return ok;
  }

  /* ---------- talking to the bot ---------- */
  // sendData works only when the app was opened from the keyboard button (/app):
  // such launches carry no query_id.
  function canSendData() {
    return !!(tg && tg.initData && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id));
  }

  function openBot(startParam) {
    const url = "https://t.me/" + BOT + (startParam ? "?start=" + startParam : "");
    if (tg && tg.openTelegramLink) {
      try { tg.openTelegramLink(url); } catch (e) { /* ignore */ }
      // the app covers the chat: close it so the bot's reply is visible
      setTimeout(() => { try { tg.close(); } catch (e) { /* ignore */ } }, 300);
    } else window.open(url, "_blank");
  }

  // "link" and "search" carry text; any other command is just a name.
  async function sendToBot(payload) {
    haptic("medium");
    if (canSendData()) { tg.sendData(JSON.stringify(payload)); return; }
    if (payload.text) {
      await copyText(payload.text);
      toast(say("copied"));
      $("#tip").hidden = false;
      setTimeout(() => (tg ? tg.close() : openBot()), 1400);
      return;
    }
    openBot("cmd_" + payload.cmd);
  }

  /* ---------- tabs ---------- */
  function showTab(name) {
    $$("section").forEach((s) => { s.hidden = s.id !== "tab-" + name; });
    $$(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    window.scrollTo({ top: 0 });
    haptic("light");
  }

  /* ---------- account pages (data comes from the bot's API) ---------- */
  const API = "https://campaigns-companies-tribe-annotated.trycloudflare.com";   // https address of the bot's API; empty = open the chat instead
  const LANG_NAMES = { en: "English", uz: "O'zbekcha", ru: "Русский" };
  let account = null;
  let currentPage = null;

  async function api(action, body) {
    const res = await fetch(API + "/api/" + action, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "tma " + (tg ? tg.initData : "") },
      body: JSON.stringify(body || {}),
    });
    if (!res.ok) throw new Error(String(res.status));
    account = await res.json();
    return account;
  }

  function chips(box, items, current, onPick) {
    box.innerHTML = "";
    items.forEach(([value, label]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(value === current));
      b.addEventListener("click", () => { haptic("light"); onPick(value); });
      box.appendChild(b);
    });
  }

  async function change(body) {
    try { await api("settings", body); toast(say("saved")); if (body.lang) applyLanguage(body.lang); renderPage(currentPage); }
    catch (e) { toast(say("loadFail")); }
  }

  function renderPage(name) {
    if (!account) return;
    const langs = Object.keys(LANG_NAMES).map((c) => [c, LANG_NAMES[c]]);
    chips($("#qualities"), [[0, say("qualityAsk")], ...account.qualities.map((q) => [q, q + "p"])], account.quality, (q) => change({ quality: q }));
    $("#automp3").setAttribute("aria-checked", String(account.auto_mp3));
    chips($("#botlangs2"), langs, account.lang, (l) => change({ lang: l }));
    renderHistory();
    $("#invited").textContent = account.invited;
    $("#invitetext").textContent = say("inviteText").replace("{n}", account.bonus);
    $("#mylink").textContent = account.invite_link;
  }

  function renderHistory() {
    const box = $("#histlist");
    box.innerHTML = "";
    $("#clearhist").hidden = !account.history.length;
    if (!account.history.length) { box.innerHTML = '<p class="muted"></p>'; box.firstChild.textContent = say("historyEmpty"); return; }
    account.history.forEach((item) => {
      const row = document.createElement("div");
      row.className = "hist";
      const quality = item.kind === "v" && item.height ? item.height + "p" : "MP3";
      row.innerHTML = '<div class="pic"></div><div class="tx"><b></b><small></small></div><button class="copy" aria-label="Copy">📋</button>';
      const pic = row.querySelector(".pic");
      if (item.thumb) pic.style.backgroundImage = "url(" + item.thumb + ")"; else pic.textContent = item.kind === "v" ? "🎬" : "🎵";
      row.querySelector("b").textContent = item.title;
      row.querySelector("small").textContent = item.site + " · " + quality;
      row.querySelector(".copy").addEventListener("click", async () => { haptic("light"); await copyText(item.url); toast(say("copied")); });
      box.appendChild(row);
    });
  }

  function showPage(name) {
    currentPage = name;
    $$("section").forEach((x) => { x.hidden = x.id !== "page-" + name; });
    window.scrollTo({ top: 0 });
    if (tg && tg.BackButton) { tg.BackButton.show(); }
    renderPage(name);
  }

  function closePage() {
    currentPage = null;
    if (tg && tg.BackButton) tg.BackButton.hide();
    showTab("me");
  }

  async function openPage(name) {
    haptic("light");
    try { if (!account) await api("me"); showPage(name); }
    catch (e) { toast(say("loadFail")); }
  }

  if (API) {
    $$("[data-page]").forEach((b) => {
      b.removeAttribute("data-cmd");
      b.addEventListener("click", () => openPage(b.dataset.page));
    });
    $$("[data-back]").forEach((b) => b.addEventListener("click", closePage));
    if (tg && tg.BackButton) tg.BackButton.onClick(closePage);
    $("#automp3").addEventListener("click", () => change({ auto_mp3: !account.auto_mp3 }));
    $("#clearhist").addEventListener("click", async () => {
      try { await api("clear_history"); toast(say("cleared")); renderPage(); } catch (e) { toast(say("loadFail")); }
    });
    $$('[data-cmd="share"]').forEach((b) => { b.removeAttribute("data-cmd"); b.addEventListener("click", () => {
      const url = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/" + BOT);
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
    }); });
    $$('[data-cmd="legal"]').forEach((b) => { b.removeAttribute("data-cmd"); b.addEventListener("click", () => { location.href = "legal.html"; }); });
    $("#copylink").addEventListener("click", async () => { await copyText(account.invite_link); toast(say("copied")); });
    $("#sharelink").addEventListener("click", () => {
      const url = "https://t.me/share/url?url=" + encodeURIComponent(account.invite_link);
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
    });
  }

  /* ---------- wiring ---------- */
  $$(".tab").forEach((t) => t.addEventListener("click", () => showTab(t.dataset.tab)));
  $$(".langs button").forEach((b) => b.addEventListener("click", async () => {
    applyLanguage(b.dataset.lang);
    haptic("light");
    if (API) {
      try { await api("settings", { lang: b.dataset.lang }); if (currentPage) renderPage(currentPage); } catch (e) { /* app language still changed */ }
    }
  }));
  $$("[data-cmd]").forEach((b) => b.addEventListener("click", () => sendToBot({ cmd: b.dataset.cmd })));
  $$("[data-chat]").forEach((b) => b.addEventListener("click", () => { haptic("light"); tg ? tg.close() : openBot(); }));
  $$("[data-focus]").forEach((b) => b.addEventListener("click", () => {
    showTab("download");
    setTimeout(() => $("#" + b.dataset.focus).focus(), 60);
  }));

  $("#paste").addEventListener("click", async () => {
    haptic("light");
    try {
      const text = tg && tg.readTextFromClipboard
        ? await new Promise((resolve) => tg.readTextFromClipboard(resolve))
        : await navigator.clipboard.readText();
      if (text) { $("#link").value = text.trim(); return; }
    } catch (e) { /* handled below */ }
    toast(say("pasteFail"));
  });

  $("#download").addEventListener("click", () => {
    const text = $("#link").value.trim();
    if (!text) { toast(say("emptyLink")); $("#link").focus(); return; }
    sendToBot({ cmd: "link", text });
  });
  $("#link").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#download").click(); });

  $("#search").addEventListener("click", () => {
    const text = $("#song").value.trim();
    if (!text) { toast(say("emptySong")); $("#song").focus(); return; }
    sendToBot({ cmd: "search", text });
  });
  $("#song").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#search").click(); });

  /* ---------- start ---------- */
  applyLanguage(pickLanguage());
  if (API && tg && tg.initData) api("me").then((a) => applyLanguage(a.lang)).catch(() => { /* keep the guessed language */ });
  // Inside Telegram but not opened from the keyboard button: explain how to send links straight to the chat.
  $("#tip").hidden = !(tg && tg.initData && !canSendData());
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch (e) { /* older clients */ }
    const dark = tg.colorScheme === "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    try { tg.setHeaderColor(dark ? "#14151b" : "#fff7ed"); tg.setBackgroundColor(dark ? "#14151b" : "#fff7ed"); } catch (e) { /* ignore */ }
  } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.dataset.theme = "dark";
  }
</script>
</body>
</html>
